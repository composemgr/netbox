# nginx proxy address - http://172.17.0.1:8101

name: netbox
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: netboxcommunity/netbox:latest
    pull_policy: always
    container_name: netbox-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    logging: *default-logging
    networks:
      - netbox
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8101:8080"
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: netbox-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SUPERUSER_NAME: ${APP_ADMIN_USER:-administrator}
      SUPERUSER_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      SUPERUSER_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      SUPERUSER_API_TOKEN: ${APP_API_TOKEN:-changeme_api_token_min_40_chars}
      DB_HOST: netbox-db
      DB_PORT: 5432
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-netbox}
      DB_USER: ${DB_USER_NAME:-netbox}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-$HOSTNAME} ${BASE_DOMAIN_NAME:-example.com}
      BASE_PATH: ""
    volumes:
      - ./volumes/data/netbox/media:/opt/netbox/netbox/media
      - ./volumes/data/netbox/reports:/opt/netbox/netbox/reports
      - ./volumes/data/netbox/scripts:/opt/netbox/netbox/scripts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://netbox-app:8080'
      - 'cloudflare.hostname=netbox.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.netbox-app.entrypoints=http'
      - 'traefik.http.routers.netbox-app-secure.tls=true'
      - 'traefik.http.routers.netbox-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.netbox-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.netbox-app.middlewares=netbox-app-https-redirect'
      - 'traefik.http.routers.netbox-app-secure.entrypoints=https'
      - 'traefik.http.routers.netbox-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.netbox-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.netbox-app-secure.service=netbox-app'
      - 'traefik.http.services.netbox-app.loadbalancer.server.port=8080'

  db:
    image: postgres:latest
    pull_policy: always
    container_name: netbox-db
    hostname: netbox-db
    restart: always
    logging: *default-logging
    networks:
      - netbox
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: netbox-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-netbox}
      POSTGRES_USER: ${DB_USER_NAME:-netbox}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - ./volumes/data/db/postgres/netbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:alpine
    pull_policy: always
    container_name: netbox-redis
    hostname: netbox-redis
    restart: always
    logging: *default-logging
    networks:
      - netbox
    environment:
      CONTAINER_NAME: netbox-redis
    volumes:
      - ./volumes/data/cache/redis/netbox:/data

networks:
  netbox:
    name: netbox
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
