name: netbox
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: netboxcommunity/netbox:latest
    container_name: netbox-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: netbox-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Superuser bootstrap
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: ${APP_ADMIN_USER:-administrator}
      SUPERUSER_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
      SUPERUSER_EMAIL: ${APP_ADMIN_USER:-administrator}@${BASE_DOMAIN_NAME:-example.com}
      SUPERUSER_API_TOKEN: ${APP_API_TOKEN:-changeme_api_token_min_40_chars}
      # PostgreSQL connection
      DB_HOST: netbox-db
      DB_PORT: 5432
      DB_NAME: ${DB_CREATE_DATABASE_NAME:-netbox}
      DB_USER: ${DB_USER_NAME:-netbox}
      DB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      # Redis connection
      REDIS_HOST: netbox-redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 0
      REDIS_CACHE_HOST: netbox-redis
      REDIS_CACHE_PORT: 6379
      REDIS_CACHE_DATABASE: 1
      # Application settings
      SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      ALLOWED_HOSTS: ${BASE_HOST_NAME:-$HOSTNAME} ${BASE_DOMAIN_NAME:-example.com}
      BASE_PATH: ""
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/netbox/media:/opt/netbox/netbox/media'
      - './volumes/data/netbox/reports:/opt/netbox/netbox/reports'
      - './volumes/data/netbox/scripts:/opt/netbox/netbox/scripts'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://netbox-app:8080'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - netbox
      - cloudflare

  db:
    image: postgres:latest
    container_name: netbox-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: netbox-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: netbox-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-netbox}
      POSTGRES_USER: ${DB_USER_NAME:-netbox}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
    volumes:
      - './volumes/data/db/postgres/netbox:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - netbox

  redis:
    image: redis:alpine
    container_name: netbox-redis
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: netbox-redis
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: netbox-redis
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/cache/redis/netbox:/data:z'
    networks:
      - netbox

networks:
  netbox:
    name: netbox
    external: false
  cloudflare:
    external: true
